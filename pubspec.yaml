name: weather_app
description: "Современное приложение погоды на Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  json_annotation: ^4.9.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#4A90E2"
  adaptive_icon_foreground: "assets/app_icon.png"